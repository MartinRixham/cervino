name: Build ISO

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - build-alpine-gnome-iso.sh
      - genapkovl-gnomelive.sh
      - test/**
      - ci/**
      - .github/workflows/build-iso.yml
  pull_request:
    paths:
      - build-alpine-gnome-iso.sh
      - genapkovl-gnomelive.sh
      - test/**
      - ci/**
      - .github/workflows/build-iso.yml
  workflow_dispatch:
    inputs:
      alpine_branch:
        description: Alpine release branch, e.g. v3.24 (blank for latest stable)
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # iso: the x86_64 ISO; rpi: the aarch64 Raspberry Pi image, cross-built
        # on the same runner.
        target: [iso, rpi]
    steps:
      - uses: actions/checkout@v4

      # The mkimage work directory plus the ISO need several GB; the stock
      # runner image leaves too little free on / without this.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Build image
        env:
          TARGET: ${{ matrix.target }}
          CONTAINER: docker
          ALPINE_BRANCH: ${{ inputs.alpine_branch }}
          OUTDIR: ${{ github.workspace }}/out
        run: ./build-alpine-gnome-iso.sh

      - name: Checksum
        working-directory: out
        run: sha256sum alpine-gnomelive-* | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: alpine-gnome-${{ matrix.target }}
          path: |
            out/alpine-gnomelive-*
            out/SHA256SUMS
          compression-level: 0
          retention-days: 14

      # Install the ISO with setup-alpine and run test/features.sh in the
      # installed system's GNOME session. The job (and so the release) fails
      # unless every test passes. The Pi image has no VM test: QEMU can't
      # emulate a Pi that runs GNOME.
      - name: Enable KVM
        if: matrix.target == 'iso'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        if: matrix.target == 'iso'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils xorriso

      - name: Test ISO in VM
        if: matrix.target == 'iso'
        env:
          WORKDIR: ${{ runner.temp }}/vm-test
        run: ci/vm-test.sh out/*.iso

      - uses: actions/upload-artifact@v4
        if: failure() && matrix.target == 'iso'
        with:
          name: vm-test-logs
          path: ${{ runner.temp }}/vm-test/*.log
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: alpine-gnome-*
          path: out
          merge-multiple: true

      # Each target's artifact has a SHA256SUMS of its own image.
      - name: Checksum
        working-directory: out
        run: sha256sum alpine-gnomelive-* | tee SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/alpine-gnomelive-* out/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes
