name: Build ISO

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - build-alpine-gnome-iso.sh
      - genapkovl-gnomelive.sh
      - cervino-desktop/**
      - apparmor.d/**
      - test/**
      - ci/**
      - .github/workflows/build-iso.yml
  pull_request:
    paths:
      - build-alpine-gnome-iso.sh
      - genapkovl-gnomelive.sh
      - cervino-desktop/**
      - apparmor.d/**
      - test/**
      - ci/**
      - .github/workflows/build-iso.yml
  workflow_dispatch:
    inputs:
      alpine_branch:
        description: Alpine release branch, e.g. v3.24 (blank for latest stable)
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # Tag builds sign with the APK_SIGNING_KEY secret of the release
    # environment, which only v* tags may deploy to; other builds run
    # without an environment, and so without the key.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # iso: the x86_64 ISO; rpi: the aarch64 Raspberry Pi image, cross-built
        # on the same runner.
        target: [iso, rpi]
    steps:
      - uses: actions/checkout@v7

      # The mkimage work directory plus the ISO need several GB; the stock
      # runner image leaves too little free on / without this.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      # Release builds sign cervino-desktop and the image's repo with the
      # release environment's APK_SIGNING_KEY secret, as the repo job signs
      # the published repo, and
      # point installs at that repo, on this repository's GitHub Pages. apk
      # knows the key by its file name, the same in both jobs.
      - name: Signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::The release environment has no APK_SIGNING_KEY secret"; exit 1; }
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/cervino.rsa"
          echo "SIGNING_KEY=$RUNNER_TEMP/cervino.rsa" >> "$GITHUB_ENV"
          echo "APK_REPO=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      - name: Build image
        env:
          TARGET: ${{ matrix.target }}
          CONTAINER: docker
          ALPINE_BRANCH: ${{ inputs.alpine_branch }}
          OUTDIR: ${{ github.workspace }}/out
        run: ./build-alpine-gnome-iso.sh

      - name: Checksum
        working-directory: out
        run: sha256sum alpine-gnomelive-* | tee SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: alpine-gnome-${{ matrix.target }}
          path: |
            out/alpine-gnomelive-*
            out/SHA256SUMS
          compression-level: 0
          retention-days: 14

      # cervino-desktop, laid out as in the published repo
      # (<branch>/<arch>/), for the repo job.
      - uses: actions/upload-artifact@v7
        with:
          name: cervino-repo-${{ matrix.target }}
          path: out/repo
          retention-days: 14

      # Install the ISO with setup-alpine and run test/features.sh in the
      # installed system's GNOME session, and test/apparmor.sh. The job (and so the release) fails
      # unless every test passes. The Pi image has no VM test: QEMU can't
      # emulate a Pi that runs GNOME.
      - name: Enable KVM
        if: matrix.target == 'iso'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        if: matrix.target == 'iso'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils xorriso

      - name: Test ISO in VM
        if: matrix.target == 'iso'
        env:
          WORKDIR: ${{ runner.temp }}/vm-test
        run: ci/vm-test.sh out/*.iso

      - uses: actions/upload-artifact@v7
        if: failure() && matrix.target == 'iso'
        with:
          name: vm-test-logs
          path: ${{ runner.temp }}/vm-test/*.log
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: alpine-gnome-*
          path: out
          merge-multiple: true

      # Each target's artifact has a SHA256SUMS of its own image.
      - name: Checksum
        working-directory: out
        run: sha256sum alpine-gnomelive-* | tee SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/alpine-gnomelive-* out/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes

  # Adds the release's cervino-desktop packages to the apk repo on the
  # gh-pages branch, which GitHub Pages serves and installs get updates from.
  # The branch holds only the repo, written by this job alone.
  repo:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    # One push to gh-pages at a time.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: cervino-repo-*
          path: new
          merge-multiple: true

      - name: Check out gh-pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --depth 1 origin gh-pages
            git worktree add --detach pages FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages pages
          fi

      # In a container of each branch's release, so its apk can read the index.
      - name: Add the packages
        env:
          KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/cervino.rsa"
          for dir in new/v*; do
            branch=${dir#new/}
            docker run --rm -v "$PWD":/src -v "$RUNNER_TEMP/cervino.rsa":/cervino.rsa:ro \
              "docker.io/library/alpine:${branch#v}" \
              sh /src/ci/publish-repo.sh /src/new /src/pages /cervino.rsa "$branch"
          done

      - name: Push
        working-directory: pages
        run: |
          git add -A
          git -c user.name='github-actions[bot]' \
            -c user.email='41898333+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "cervino-desktop from $GITHUB_REF_NAME"
          git push origin HEAD:gh-pages
