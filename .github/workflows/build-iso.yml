name: Build ISO

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - build-alpine-gnome-iso.sh
      - genapkovl-gnomelive.sh
      - live/**
      - mkimg.gnomelive.sh
      - cervino-desktop/**
      - cervino-vlc/**
      - cervino-gstreamer/**
      - cervino-terminal/**
      - cervino-upnp/**
      - apparmor.d/**
      - rpi/**
      - patched/**
      - extra/**
      - test/**
      - ci/**
      - .github/workflows/build-iso.yml
  pull_request:
    paths:
      - build-alpine-gnome-iso.sh
      - genapkovl-gnomelive.sh
      - live/**
      - mkimg.gnomelive.sh
      - cervino-desktop/**
      - cervino-vlc/**
      - cervino-gstreamer/**
      - cervino-terminal/**
      - cervino-upnp/**
      - apparmor.d/**
      - rpi/**
      - patched/**
      - extra/**
      - test/**
      - ci/**
      - .github/workflows/build-iso.yml
  # Daily, so that a change in Alpine (a new version of a package patched
  # in rpi/ or patched/, a patch that no longer applies) shows up without a
  # push.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      alpine_branch:
        description: Alpine release branch, e.g. v3.24 (blank for latest stable)
        required: false
        default: ""

# By event too, so the daily run and a push to main don't cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The packages built from rpi/, patched/ and extra/, each in a job of
  # its own (ONLY), so that those that need building build side by side
  # rather than one after another, and the Pi's Firefox, which takes
  # hours, gets a job's whole time. Each is kept in a cache of its own,
  # keyed on the target and the hash the build writes next to it: the
  # newest is restored, and the build takes it from there while that hash
  # still matches its sources, so most of these jobs only find it there.
  # The image's build then takes them all from these jobs' artifacts.
  packages:
    runs-on: ${{ matrix.target == 'x86_64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    # The most a GitHub-hosted runner allows, for firefox.
    timeout-minutes: ${{ matrix.pkg == 'firefox' && 360 || 240 }}
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, arm64, rpi]
        pkg:
          - mutter
          - showtime
          - dnsmasq
          - libsoup3
          - tui-torrent
          - bapk
          - qstop
          - bijiben
          - rpi-keyboard-config
          - tomesole
          - spotatui
          - mullvad-containers
          - pam-cryptsetup-keyring
        # The Pi's own. A package that builds with another's (dep) is
        # built in the same job, after it, as its key includes the other's.
        include:
          - { target: rpi, pkg: vlc, dep: ffmpeg7 }
          - { target: rpi, pkg: gst-plugins-bad, dep: gst-plugins-base }
          - { target: rpi, pkg: wpa_supplicant }
          - { target: rpi, pkg: bluez }
          - { target: rpi, pkg: mesa }
          - { target: rpi, pkg: linux-rpi }
          - { target: rpi, pkg: firefox }
          - { target: rpi, pkg: rpi-keyboard-fw-update }
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      # Linking libxul with LTO (and Rust's) needs more memory than the
      # runner's 16 GB.
      - name: Swap
        if: matrix.pkg == 'firefox'
        run: |
          sudo fallocate -l 16G /swapfile-firefox
          sudo chmod 600 /swapfile-firefox
          sudo mkswap /swapfile-firefox
          sudo swapon /swapfile-firefox
          free -h

      - name: Restore ${{ matrix.dep }}
        id: restore-dep
        if: matrix.dep
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/pkgcache/${{ matrix.dep }}
          key: ${{ matrix.target }}-${{ matrix.dep }}-${{ github.sha }}
          restore-keys: ${{ matrix.target }}-${{ matrix.dep }}-

      - name: Restore ${{ matrix.pkg }}
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/pkgcache/${{ matrix.pkg }}
          key: ${{ matrix.target }}-${{ matrix.pkg }}-${{ github.sha }}
          restore-keys: ${{ matrix.target }}-${{ matrix.pkg }}-

      - name: Build ${{ matrix.pkg }}
        env:
          TARGET: ${{ matrix.target }}
          CONTAINER: docker
          ALPINE_BRANCH: ${{ inputs.alpine_branch }}
          CACHEDIR: ${{ runner.temp }}/pkgcache
          ONLY: ${{ matrix.dep }} ${{ matrix.pkg }}
        run: ./build-alpine-gnome-iso.sh

      # Each package the build made (its hash is not the restored one's)
      # goes in the cache, even if the build stopped after it.
      - name: Cache keys
        id: keys
        if: always()
        env:
          TARGET: ${{ matrix.target }}
          DEP: ${{ matrix.dep }}
          PKG: ${{ matrix.pkg }}
        run: |
          for out in dep pkg; do
            name=${out^^}
            name=${!name}
            key=$RUNNER_TEMP/pkgcache/$name/key
            [ -z "$name" ] || [ ! -f "$key" ] ||
              echo "$out=$TARGET-$name-$(cat "$key")" >> "$GITHUB_OUTPUT"
          done

      - name: Save ${{ matrix.dep }}
        if: >-
          always() && steps.keys.outputs.dep &&
          steps.keys.outputs.dep != steps.restore-dep.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/pkgcache/${{ matrix.dep }}
          key: ${{ steps.keys.outputs.dep }}

      - name: Save ${{ matrix.pkg }}
        if: >-
          always() && steps.keys.outputs.pkg &&
          steps.keys.outputs.pkg != steps.restore.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/pkgcache/${{ matrix.pkg }}
          key: ${{ steps.keys.outputs.pkg }}

      # The package's directory (and its dep's), for the image's build.
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.target }}-${{ matrix.pkg }}
          path: ${{ runner.temp }}/pkgcache
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  build:
    # After the packages, which it takes from their jobs' artifacts; a
    # target whose packages built builds even if another's failed.
    needs: packages
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    # Tag builds sign with the APK_SIGNING_KEY secret of the release
    # environment, which only v* tags may deploy to; other builds run
    # without an environment, and so without the key (see Package repo).
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64: the x86_64 ISO; arm64: the aarch64 ISO; rpi: the aarch64
        # Raspberry Pi image. The aarch64 ones on an arm64 runner, as the
        # build runs the target's packages' scripts.
        include:
          - target: x86_64
            runner: ubuntu-latest
          - target: arm64
            runner: ubuntu-24.04-arm
          - target: rpi
            runner: ubuntu-24.04-arm
    steps:
      # The full history: the build versions cervino-vlc,
      # cervino-gstreamer, cervino-terminal and cervino-upnp from the last
      # commits that changed them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The mkimage work directory plus the ISO need several GB; the stock
      # runner image leaves too little free on / without this.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      # Every build points installs at the published repo, on this
      # repository's GitHub Pages. Other builds than a release's can't sign
      # with its key, so their package brings its public key, the
      # repository variable APK_PUBLIC_KEY, next to their own; without the
      # variable they get no repo.
      - name: Package repo
        env:
          PUBKEY: ${{ vars.APK_PUBLIC_KEY }}
        run: |
          pages=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}
          case $GITHUB_REF in
            refs/tags/v*) ;;
            *)
              [ -n "$PUBKEY" ] || {
                echo "::notice::No APK_PUBLIC_KEY variable: the image gets no package repo"
                exit 0
              }
              printf '%s\n' "$PUBKEY" > "$RUNNER_TEMP/cervino.rsa.pub"
              echo "APK_REPO_KEY=$RUNNER_TEMP/cervino.rsa.pub" >> "$GITHUB_ENV"
              ;;
          esac
          echo "APK_REPO=$pages" >> "$GITHUB_ENV"

      # Release builds sign cervino-desktop and the image's repo with the
      # release environment's APK_SIGNING_KEY secret, as the repo job signs
      # the published repo. apk knows the key by its file name, the same in
      # both jobs. It must be the key other builds trust (Package repo).
      - name: Signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEY: ${{ secrets.APK_SIGNING_KEY }}
          PUBKEY: ${{ vars.APK_PUBLIC_KEY }}
        run: |
          [ -n "$KEY" ] || {
            echo "::error::The release environment has no APK_SIGNING_KEY secret"
            exit 1
          }
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/cervino.rsa"
          pub=$(openssl rsa -in "$RUNNER_TEMP/cervino.rsa" -pubout 2> /dev/null)
          [ -z "$PUBKEY" ] || [ "$pub" = "$PUBKEY" ] || {
            echo "::error::The APK_PUBLIC_KEY variable is not APK_SIGNING_KEY's public key"
            exit 1
          }
          echo "SIGNING_KEY=$RUNNER_TEMP/cervino.rsa" >> "$GITHUB_ENV"

      # The packages jobs' (see packages), each in a directory of its own.
      - uses: actions/download-artifact@v7
        with:
          pattern: pkg-${{ matrix.target }}-*
          path: ${{ runner.temp }}/pkgcache
          merge-multiple: true

      - name: Build image
        env:
          TARGET: ${{ matrix.target }}
          CONTAINER: docker
          ALPINE_BRANCH: ${{ inputs.alpine_branch }}
          OUTDIR: ${{ github.workspace }}/out
          CACHEDIR: ${{ runner.temp }}/pkgcache
          CACHE_ONLY: all
        run: ./build-alpine-gnome-iso.sh

      - name: Checksum
        working-directory: out
        run: sha256sum alpine-gnomelive-* | tee SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: alpine-gnome-${{ matrix.target }}
          path: |
            out/alpine-gnomelive-*
            out/SHA256SUMS
          compression-level: 0
          retention-days: 14

      # The packages the build made, laid out as in the published repo
      # (<branch>/<arch>/), for the repo job.
      - uses: actions/upload-artifact@v7
        with:
          name: cervino-repo-${{ matrix.target }}
          path: out/repo
          retention-days: 14

      # update-alpine, from the package just built, in containers of this
      # release and the one before (see the script). The package is the same
      # for both targets, so it is tested once.
      - name: Test update-alpine
        if: matrix.target == 'x86_64'
        env:
          CONTAINER: docker
        run: ci/update-test.sh out/repo

      # cervino-kernel's package checks, and the kernel's own in a small
      # VM (test/kernel.sh; on a Pi it boots the Pi's system and runs the
      # OS feature tests too).
      - name: Test cervino-kernel
        if: matrix.target == 'rpi'
        env:
          CONTAINER: docker
        run: test/kernel.sh out/repo

  # ci/vm-test.sh (README.md, Prebuilt ISOs), once per install mode, each
  # on a runner of its own: the VM needs 8 GB, and a runner has 16.
  vm-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        install: [atomic, sys]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: alpine-gnome-x86_64
          path: out

      # The packages the image leaves out (cervino-gstreamer,
      # cervino-terminal and cervino-upnp), which the VM test adds before
      # running the tests.
      - uses: actions/download-artifact@v7
        with:
          name: cervino-repo-x86_64
          path: out/repo

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils xorriso ovmf

      - name: Test ISO in VM
        env:
          INSTALL_MODE: ${{ matrix.install }}
          WORKDIR: ${{ runner.temp }}/vm-test
        run: ci/vm-test.sh out/*.iso out/repo

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: vm-test-logs-${{ matrix.install }}
          path: ${{ runner.temp }}/vm-test/*.log
          retention-days: 14

  # The build's packages, as assets of a prerelease ci-<run id>, for
  # ci/local-repo.sh (README.md, Upgrading to a CI build): anyone may
  # download a public repository's release assets, but only logged in
  # users its artifacts. Not for tags, which publish their packages to the
  # repo, nor pull requests from forks, whose token can't write. Those of
  # runs more than 14 days old, as long as artifacts are kept, are deleted.
  ci-packages:
    needs: build
    if: >-
      !startsWith(github.ref, 'refs/tags/') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: cervino-repo-*
          path: repos

      - name: Publish the packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ci-${{ github.run_id }}
          # A pull request's head: its merge commit is on no branch.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # Laid out as in the artifact, <branch>/<arch>/.
          for dir in repos/cervino-repo-*; do
            tar -cf "$dir.tar" -C "$dir" .
          done
          gh release create "$TAG" repos/cervino-repo-*.tar --target "$SHA" \
            --prerelease --latest=false --title "CI build $GITHUB_RUN_ID of $BRANCH" \
            --notes "The packages of [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID), for ci/local-repo.sh (README.md, Upgrading to a CI build). Deleted after 14 days."

      - name: Delete old CI packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/$GH_REPO/releases" --jq \
            ".[] | select((.tag_name | startswith(\"ci-\")) and .created_at < \"$cutoff\") | .tag_name" |
            while read -r tag; do
              # Another run may be deleting it too.
              gh release delete "$tag" --cleanup-tag --yes || echo "::warning::could not delete $tag"
            done

  release:
    needs: [build, vm-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: alpine-gnome-*
          path: out
          merge-multiple: true

      # Each target's artifact has a SHA256SUMS of its own image.
      - name: Checksum
        working-directory: out
        run: sha256sum alpine-gnomelive-* | tee SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/alpine-gnomelive-* out/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes

  # Adds the release's packages to the apk repo on the gh-pages branch
  # (README.md, Updates).
  repo:
    needs: [build, vm-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    # One push to gh-pages at a time.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # The ISOs' packages in one repo (x86_64 and aarch64), the Pi's in
      # another, under rpi/, as they are aarch64 too.
      - uses: actions/download-artifact@v7
        with:
          name: cervino-repo-x86_64
          path: new

      - uses: actions/download-artifact@v7
        with:
          name: cervino-repo-arm64
          path: new

      - uses: actions/download-artifact@v7
        with:
          name: cervino-repo-rpi
          path: new-rpi

      # See ci/publish-repo.sh.
      - name: Publish the packages
        env:
          KEY: ${{ secrets.APK_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/cervino.rsa"
          umask 022
          ci/publish-repo.sh "$RUNNER_TEMP/cervino.rsa" new rpi=new-rpi
